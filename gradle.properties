# The project version is no longer defined here.  It is derived from the most recent 'v<version>' git tag (see
# build.gradle) and can be overridden with -PprojectVersion=<version>.
#
# Version tag naming conventions:
#   Alpha: vmaj.min.patch-alpha-build
#    Beta: vmaj.min.patch-beta-build
# Release: vmaj.min.patch
#
# Example: v0.6.0-beta-5
#
# Note: this is so that the file names for the resultant release build products match the GitHub release asset
# tag name, specifically the dashes inserted before and after the alpha/beta labels.
# See: https://github.com/DSheirer/sdrtrunk/issues/1651
